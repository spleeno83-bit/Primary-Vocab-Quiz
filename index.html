<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Explorers — vocabulary quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF7EA;
    --ink:#241F38;
    --ink-soft:#5B5470;
    --card:#FFFFFF;
    --line:#EDE3CE;
    --brand:#E94F7C;
    --brand-dark:#B93760;
    --gold:#FFC93C;
    --good:#1DBFA3;
    --good-dark:#0E7A67;
    --bad:#F45B69;
    --bad-dark:#B72A38;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Atkinson Hyperlegible', sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    margin:0;
    letter-spacing:0.2px;
  }
  #app{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  button{
    font-family:inherit;
    cursor:pointer;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
    gap:12px;
  }
  .brandmark{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brandmark .mark{
    width:38px;height:38px;border-radius:11px;
    background:var(--brand);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;
    flex:none;
  }
  .brandmark .title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:20px;
    color:var(--ink);
  }
  .ghost-btn{
    background:transparent;
    border:2px solid var(--line);
    border-radius:12px;
    padding:9px 14px;
    font-size:14px;
    font-weight:700;
    color:var(--ink-soft);
    transition:border-color .15s, color .15s;
  }
  .ghost-btn:hover{border-color:var(--brand); color:var(--brand-dark);}

  .hero{
    text-align:left;
    margin:8px 0 28px;
  }
  .hero h1{font-size:34px; line-height:1.15;}
  .hero p{
    margin:10px 0 0;
    color:var(--ink-soft);
    font-size:16px;
    max-width:52ch;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    margin-top:6px;
  }
  @media (max-width:560px){
    .grid{grid-template-columns:repeat(2, 1fr);}
  }
  .tile{
    border:none;
    border-radius:18px;
    padding:18px 14px;
    text-align:left;
    color:#fff;
    display:flex;
    flex-direction:column;
    gap:22px;
    min-height:108px;
    position:relative;
    box-shadow: 0 3px 0 rgba(0,0,0,0.14);
    transition:transform .12s ease;
  }
  .tile:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.14);}
  .tile .letter{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:20px;
    width:38px;height:38px;
    border-radius:10px;
    background:rgba(255,255,255,0.25);
    display:flex;align-items:center;justify-content:center;
  }
  .tile .name{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    line-height:1.2;
  }
  .tile .count{
    font-size:12px;
    opacity:0.85;
    font-weight:400;
  }

  .card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:20px;
    padding:24px;
  }
  .section-label{
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin:0 0 10px;
  }
  .chiprow{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    border:2px solid var(--line);
    background:#fff;
    border-radius:999px;
    padding:8px 16px;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .chip.selected{
    border-color:var(--subject-color, var(--brand));
    background:var(--subject-color, var(--brand));
    color:#fff;
  }
  .chip.small{padding:6px 12px; font-size:13px;}
  .chip.empty{
    opacity:0.35;
    cursor:not-allowed;
  }

  .setup-row{margin-bottom:22px;}
  .setup-row:last-child{margin-bottom:0;}

  .topic-actions{
    display:flex;
    gap:10px;
    margin-top:10px;
  }
  .textlink{
    background:none;border:none;
    color:var(--brand-dark);
    font-weight:700;
    font-size:13px;
    padding:0;
    text-decoration:underline;
  }

  .count-note{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:14px;
  }

  .cta-row{
    margin-top:24px;
    display:flex;
    gap:12px;
    align-items:center;
  }
  .cta{
    border:none;
    border-radius:14px;
    padding:14px 22px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    color:#fff;
    background:var(--subject-color, var(--brand));
    box-shadow:0 3px 0 rgba(0,0,0,0.18);
  }
  .cta:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.18);}
  .cta:disabled{
    background:#D9D3C4;
    box-shadow:none;
    cursor:not-allowed;
  }
  .cta.secondary{
    background:transparent;
    color:var(--ink);
    border:2px solid var(--line);
    box-shadow:none;
    padding:12px 20px;
  }
  .error-text{
    color:var(--bad-dark);
    font-size:14px;
    font-weight:700;
    margin-top:10px;
  }

  .loading-wrap{
    text-align:center;
    padding:60px 20px;
  }
  .spinner{
    width:46px;height:46px;
    border-radius:50%;
    border:5px solid var(--line);
    border-top-color:var(--subject-color, var(--brand));
    margin:0 auto 18px;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-wrap p{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:17px;
  }

  .quiz-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .dots{
    display:flex;
    gap:6px;
  }
  .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--line);
  }
  .dot.done{background:var(--subject-color, var(--brand));}
  .dot.current{
    background:var(--subject-color, var(--brand));
    box-shadow:0 0 0 3px rgba(0,0,0,0.06);
  }
  .score-pill{
    background:var(--gold);
    color:#5B3E00;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:6px 14px;
    border-radius:999px;
  }

  .quiz-word{
    text-align:center;
    padding:8px 0 26px;
  }
  .quiz-word .eyebrow{
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .quiz-word h2{
    font-size:32px;
    color:var(--subject-color, var(--brand));
  }

  .options{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
  }
  .option{
    text-align:left;
    border:2px solid var(--line);
    background:#fff;
    border-radius:14px;
    padding:14px 16px;
    font-size:15px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:12px;
  }
  .option .badge{
    flex:none;
    width:26px;height:26px;
    border-radius:8px;
    background:var(--paper);
    border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink-soft);
  }
  .option:hover:not(:disabled){border-color:var(--subject-color, var(--brand));}
  .option:disabled{cursor:default;}
  .option.correct{
    border-color:var(--good-dark);
    background:#EAFBF6;
  }
  .option.correct .badge{background:var(--good); border-color:var(--good-dark); color:#fff;}
  .option.wrong{
    border-color:var(--bad-dark);
    background:#FEEEEF;
  }
  .option.wrong .badge{background:var(--bad); border-color:var(--bad-dark); color:#fff;}

  .feedback{
    margin-top:16px;
    padding:14px 16px;
    border-radius:14px;
    font-size:14px;
    font-weight:700;
  }
  .feedback.good{background:#EAFBF6; color:var(--good-dark);}
  .feedback.bad{background:#FEEEEF; color:var(--bad-dark);}

  .results-hero{
    text-align:center;
    padding:8px 0 8px;
  }
  .stars{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:6px 0 18px;
  }
  .stars svg{width:38px;height:38px;}
  .big-score{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:44px;
    color:var(--subject-color, var(--brand));
  }
  .results-msg{
    font-size:16px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .review-list{margin-top:24px;}
  .review-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 4px;
    border-bottom:1px solid var(--line);
    font-size:14px;
    gap:12px;
  }
  .review-item:last-child{border-bottom:none;}
  .review-item .w{font-weight:700;}
  .review-item .status{
    flex:none;
    width:24px;height:24px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    font-weight:700;
    color:#fff;
  }
  .review-item .status.ok{background:var(--good);}
  .review-item .status.no{background:var(--bad);}

  .name-row{
    display:flex;
    gap:10px;
    margin-top:22px;
    flex-wrap:wrap;
  }
  .name-row input{
    flex:1;
    min-width:160px;
    border:2px solid var(--line);
    border-radius:12px;
    padding:10px 14px;
    font-size:15px;
    font-family:inherit;
  }
  .name-row input:focus{outline:none; border-color:var(--brand);}
  .saved-note{
    color:var(--good-dark);
    font-weight:700;
    font-size:13px;
    margin-top:8px;
  }

  .history-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
    gap:12px;
  }
  .history-item:last-child{border-bottom:none;}
  .history-item .h-left{display:flex; align-items:center; gap:12px;}
  .history-item .swatch{
    width:34px;height:34px;border-radius:9px;flex:none;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;
  }
  .history-item .meta{font-size:12px; color:var(--ink-soft);}
  .history-item .score{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
  }
  .empty-note{
    color:var(--ink-soft);
    font-size:14px;
    padding:20px 4px;
  }
</style>
</head>

<script>
const VOCAB = JSON.parse(document.getElementById('vocab-data').textContent);
const YEARS = ['Year 1','Year 2','Year 3','Year 4','Year 5','Year 6'];

const SUBJECT_META = {
  'Art':        {label:'Art & design',        color:'#E94F7C', letter:'A'},
  'Computing':  {label:'Computing',            color:'#4C6FFF', letter:'C'},
  'DT':         {label:'Design & technology',  color:'#FF9F1C', letter:'D'},
  'Geography':  {label:'Geography',            color:'#1DBFA3', letter:'G'},
  'History':    {label:'History',              color:'#A66DD4', letter:'H'},
  'Maths':      {label:'Maths',                color:'#2AA8D8', letter:'M'},
  'Music':      {label:'Music',                color:'#F45B69', letter:'M'},
  'PE':         {label:'PE',                   color:'#4FAF3D', letter:'P'},
  'RE':         {label:'RE',                   color:'#C98A3B', letter:'R'},
  'Science':    {label:'Science',              color:'#22B8CF', letter:'S'},
  'Writing':    {label:'Writing',              color:'#FF6F91', letter:'W'}
};
const SUBJECT_ORDER = ['Art','Computing','DT','Geography','History','Maths','Music','PE','RE','Science','Writing'];

const state = {
  screen:'home',
  subject:null,
  year:'Year 3',
  selectedTopics:new Set(),
  numQuestions:8,
  questions:[],
  current:0,
  score:0,
  answers:[],
  loadError:null,
  playerName:'',
  saved:false
};

const app = document.getElementById('app');

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function subjectTopicsForYear(subject, year){
  const topics = VOCAB[subject] || {};
  const out = [];
  for(const topic in topics){
    const words = topics[topic][year];
    if(words && words.length){
      out.push({topic, words});
    }
  }
  return out;
}

function wordCountForSubject(subject){
  let total = 0;
  const topics = VOCAB[subject] || {};
  for(const t in topics){
    for(const y in topics[t]) total += topics[t][y].length;
  }
  return total;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setScreen(screen){
  state.screen = screen;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function topBar(color){
  return `
  <div class="topbar">
    <div class="brandmark">
      <div class="mark" style="background:${color || 'var(--brand)'}">W</div>
      <div class="title">Word Explorers</div>
    </div>
    <button class="ghost-btn" id="btn-history">My scores</button>
  </div>`;
}

function renderHome(){
  const tiles = SUBJECT_ORDER.map(key => {
    const meta = SUBJECT_META[key];
    const count = wordCountForSubject(key);
    return `
    <button class="tile" style="background:${meta.color}" data-subject="${key}">
      <span class="letter">${meta.letter}</span>
      <span>
        <span class="name">${esc(meta.label)}</span><br>
        <span class="count">${count} words</span>
      </span>
    </button>`;
  }).join('');

  app.innerHTML = `
    ${topBar()}
    <div class="hero">
      <h1>Which subject shall we explore?</h1>
      <p>Pick a subject, choose a year group, and take a quick quiz to see which words you already know.</p>
    </div>
    <div class="grid">${tiles}</div>
  `;

  app.querySelectorAll('.tile').forEach(btn => {
    btn.addEventListener('click', () => {
      state.subject = btn.dataset.subject;
      state.selectedTopics = new Set();
      state.loadError = null;
      setScreen('setup');
    });
  });
  document.getElementById('btn-history').addEventListener('click', () => setScreen('history'));
}

function renderSetup(){
  const meta = SUBJECT_META[state.subject];
  const color = meta.color;
  const yearChips = YEARS.map(y => {
    const has = subjectTopicsForYear(state.subject, y).length > 0;
    const cls = ['chip'];
    if(y === state.year) cls.push('selected');
    if(!has) cls.push('empty');
    return `<button class="${cls.join(' ')}" style="--subject-color:${color}" data-year="${y}" ${has ? '' : 'disabled'}>${y}</button>`;
  }).join('');

  const topicsAvail = subjectTopicsForYear(state.subject, state.year);
  if(topicsAvail.length && state.selectedTopics.size === 0){
    topicsAvail.forEach(t => state.selectedTopics.add(t.topic));
  }
  const topicChips = topicsAvail.map(t => {
    const sel = state.selectedTopics.has(t.topic);
    return `<button class="chip small ${sel ? 'selected' : ''}" style="--subject-color:${color}" data-topic="${esc(t.topic)}">${esc(t.topic)} (${t.words.length})</button>`;
  }).join('');

  const pool = topicsAvail.filter(t => state.selectedTopics.has(t.topic))
    .flatMap(t => t.words);
  const uniquePool = Array.from(new Set(pool.map(w => w.toLowerCase())));
  const maxQ = Math.min(12, uniquePool.length);
  const sizes = [5,8,12].filter(n => n <= maxQ);
  if(sizes.length === 0 && uniquePool.length > 0) sizes.push(uniquePool.length);
  if(!sizes.includes(state.numQuestions)) state.numQuestions = sizes[sizes.length - 1] || 0;

  const sizeChips = sizes.map(n => `<button class="chip small ${n===state.numQuestions?'selected':''}" style="--subject-color:${color}" data-size="${n}">${n} words</button>`).join('');

  app.innerHTML = `
    ${topBar(color)}
    <div class="hero">
      <h1 style="color:${color}">${esc(meta.label)}</h1>
      <p>Choose a year group and the topics you'd like to be quizzed on.</p>
    </div>
    <div class="card">
      <div class="setup-row">
        <p class="section-label">Year group</p>
        <div class="chiprow">${yearChips}</div>
      </div>
      <div class="setup-row">
        <p class="section-label">Topics</p>
        <div class="chiprow">${topicChips || '<span class="empty-note">No topics for this year group yet.</span>'}</div>
        ${topicsAvail.length ? `<div class="topic-actions">
          <button class="textlink" id="topics-all">Select all</button>
          <button class="textlink" id="topics-none">Clear</button>
        </div>` : ''}
      </div>
      <div class="setup-row">
        <p class="section-label">Quiz length</p>
        <div class="chiprow">${sizeChips || '<span class="empty-note">Pick at least one topic first.</span>'}</div>
      </div>
      <p class="count-note">${uniquePool.length} word${uniquePool.length===1?'':'s'} available from your selection.</p>
      ${state.loadError ? `<p class="error-text">${esc(state.loadError)}</p>` : ''}
      <div class="cta-row">
        <button class="cta" style="--subject-color:${color}" id="btn-start" ${uniquePool.length === 0 ? 'disabled' : ''}>Start quiz</button>
        <button class="cta secondary" id="btn-back">Back</button>
      </div>
    </div>
  `;

  app.querySelectorAll('[data-year]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.year = btn.dataset.year;
      state.selectedTopics = new Set();
      render();
    });
  });
  app.querySelectorAll('[data-topic]').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = btn.dataset.topic;
      if(state.selectedTopics.has(t)) state.selectedTopics.delete(t);
      else state.selectedTopics.add(t);
      render();
    });
  });
  app.querySelectorAll('[data-size]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.numQuestions = Number(btn.dataset.size);
      render();
    });
  });
  const allBtn = document.getElementById('topics-all');
  if(allBtn) allBtn.addEventListener('click', () => {
    topicsAvail.forEach(t => state.selectedTopics.add(t.topic));
    render();
  });
  const noneBtn = document.getElementById('topics-none');
  if(noneBtn) noneBtn.addEventListener('click', () => {
    state.selectedTopics.clear();
    render();
  });
  document.getElementById('btn-back').addEventListener('click', () => setScreen('home'));
  const startBtn = document.getElementById('btn-start');
  if(startBtn) startBtn.addEventListener('click', () => startQuiz(uniquePool, topicsAvail));
  document.getElementById('btn-history').addEventListener('click', () => setScreen('history'));
}

async function startQuiz(uniquePoolLower, topicsAvail){
  const color = SUBJECT_META[state.subject].color;
  const allWords = topicsAvail.filter(t => state.selectedTopics.has(t.topic)).flatMap(t => t.words.map(w => ({word:w, topic:t.topic})));
  const seen = new Set();
  const dedup = [];
  allWords.forEach(item => {
    const k = item.word.toLowerCase();
    if(!seen.has(k)){ seen.add(k); dedup.push(item); }
  });
  const picked = shuffle(dedup).slice(0, state.numQuestions);

  state.loadError = null;
  setScreen('loading');

  try{
    const questions = await generateQuestions(picked, state.subject, state.year, color);
    state.questions = questions;
    state.current = 0;
    state.score = 0;
    state.answers = [];
    setScreen('quiz');
  }catch(err){
    state.loadError = 'Could not build the quiz just then. Please try again.';
    setScreen('setup');
  }
}

function levelHint(year){
  const n = Number(year.replace('Year ',''));
  if(n <= 2) return 'Use very short, simple everyday words a 5-7 year old would understand. Definitions should be under 8 words.';
  if(n <= 4) return 'Use simple, clear language suitable for a 7-9 year old. Definitions should be under 10 words.';
  return 'Use clear language suitable for a 9-11 year old, can include slightly more precise vocabulary. Definitions should be under 12 words.';
}

async function generateQuestions(items, subject, year, color){
  const subjectLabel = SUBJECT_META[subject].label;
  const wordList = items.map(i => `${i.word} (topic: ${i.topic})`).join('; ');

  const systemPrompt = `You write UK primary school vocabulary quiz questions for the subject "${subjectLabel}", ${year}. ${levelHint(year)} For every word given, return its correct pupil-friendly definition and exactly 3 plausible but wrong definitions (distractors), written in a similar style and length to the correct one so the correct answer isn't obvious from length or tone. Distractors should be believable, not silly. Respond with ONLY compact JSON, no markdown fences, no commentary, in this exact shape: [{"word":"...","correct":"...","distractors":["...","...","..."]}]. Keep every definition under the word limit given above. Return exactly one object per word given, in the order given.`;

  // Calls our own Worker (see /src/index.js) instead of Anthropic directly, so the API key never has to live in this page's JavaScript.
  const response = await fetch("/api/generate-quiz", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      system: systemPrompt,
      userMessage: `Words: ${wordList}`
    })
  });

  if(!response.ok){
    const errText = await response.text().catch(() => '');
    throw new Error('Quiz generation failed: ' + errText);
  }

  const data = await response.json();
  let text = data.content.map(c => c.text || '').join('');
  text = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const parsed = JSON.parse(text);

  return parsed.map(q => {
    const options = shuffle([q.correct, ...q.distractors]);
    return {
      word: q.word,
      correct: q.correct,
      options
    };
  }).filter(q => q.options.length === 4);
}

function renderLoading(){
  const color = SUBJECT_META[state.subject].color;
  app.innerHTML = `
    ${topBar(color)}
    <div class="loading-wrap">
      <div class="spinner" style="--subject-color:${color}"></div>
      <p>Building your quiz...</p>
    </div>
  `;
  document.getElementById('btn-history').addEventListener('click', () => setScreen('history'));
}

function renderQuiz(){
  const color = SUBJECT_META[state.subject].color;
  const q = state.questions[state.current];
  const total = state.questions.length;

  const dots = state.questions.map((_, i) => {
    let cls = 'dot';
    if(i < state.current) cls += ' done';
    else if(i === state.current) cls += ' current';
    return `<span class="${cls}" style="${i <= state.current ? `background:${color}` : ''}"></span>`;
  }).join('');

  const answered = state.answers[state.current] !== undefined;

  const optionsHtml = q.options.map((opt, i) => {
    let extra = '';
    if(answered){
      const chosen = state.answers[state.current];
      if(opt === q.correct) extra = ' correct';
      else if(i === chosen) extra = ' wrong';
    }
    return `<button class="option${extra}" data-index="${i}" ${answered ? 'disabled' : ''}>
      <span class="badge">${String.fromCharCode(65+i)}</span>
      <span>${esc(opt)}</span>
    </button>`;
  }).join('');

  let feedbackHtml = '';
  if(answered){
    const chosenIndex = state.answers[state.current];
    const wasCorrect = q.options[chosenIndex] === q.correct;
    feedbackHtml = `<div class="feedback ${wasCorrect ? 'good' : 'bad'}">${wasCorrect ? 'Nice one, that\'s right!' : 'Not quite — the correct meaning is highlighted above.'}</div>`;
  }

  app.innerHTML = `
    ${topBar(color)}
    <div class="quiz-top">
      <div class="dots">${dots}</div>
      <div class="score-pill">${state.score} / ${total}</div>
    </div>
    <div class="card">
      <div class="quiz-word">
        <div class="eyebrow">Question ${state.current + 1} of ${total} · what does this mean?</div>
        <h2 style="color:${color}">${esc(q.word)}</h2>
      </div>
      <div class="options" style="--subject-color:${color}">${optionsHtml}</div>
      ${feedbackHtml}
      <div class="cta-row">
        ${answered
          ? `<button class="cta" style="--subject-color:${color}" id="btn-next">${state.current + 1 === total ? 'See my results' : 'Next word'}</button>`
          : `<button class="cta secondary" id="btn-quit">Quit quiz</button>`}
      </div>
    </div>
  `;

  if(!answered){
    app.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.index);
        state.answers[state.current] = idx;
        if(q.options[idx] === q.correct) state.score += 1;
        render();
      });
    });
    document.getElementById('btn-quit').addEventListener('click', () => setScreen('home'));
  } else {
    document.getElementById('btn-next').addEventListener('click', () => {
      if(state.current + 1 < total){
        state.current += 1;
        render();
      } else {
        state.saved = false;
        state.playerName = '';
        setScreen('results');
      }
    });
  }
  document.getElementById('btn-history').addEventListener('click', () => setScreen('history'));
}

function starsSvg(n){
  let out = '';
  for(let i = 0; i < 3; i++){
    const filled = i < n;
    out += `<svg viewBox="0 0 24 24" fill="${filled ? 'var(--gold)' : 'none'}" stroke="${filled ? '#B8860B' : 'var(--line)'}" stroke-width="1.5">
      <path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7-5.4-4.7 7.1-.6z" stroke-linejoin="round"/>
    </svg>`;
  }
  return out;
}

function renderResults(){
  const color = SUBJECT_META[state.subject].color;
  const total = state.questions.length;
  const pct = total ? state.score / total : 0;
  const stars = pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : pct >= 0.3 ? 1 : 0;
  let msg = 'Keep exploring — every word you learn counts!';
  if(pct >= 0.9) msg = 'Amazing! You really know these words.';
  else if(pct >= 0.6) msg = 'Great job — you know most of these words.';
  else if(pct >= 0.3) msg = 'Good try — a few more goes and you\'ll have these nailed.';

  const reviewItems = state.questions.map((q, i) => {
    const chosenIndex = state.answers[i];
    const ok = q.options[chosenIndex] === q.correct;
    return `<div class="review-item">
      <span class="w">${esc(q.word)}</span>
      <span class="status ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✕'}</span>
    </div>`;
  }).join('');

  app.innerHTML = `
    ${topBar(color)}
    <div class="card">
      <div class="results-hero">
        <div class="stars">${starsSvg(stars)}</div>
        <div class="big-score" style="color:${color}">${state.score} / ${total}</div>
        <p class="results-msg">${msg}</p>
      </div>
      <div class="review-list">${reviewItems}</div>
      ${!state.saved ? `
      <div class="name-row">
        <input type="text" id="name-input" placeholder="Your first name (optional)" maxlength="30">
        <button class="cta secondary" id="btn-save">Save score</button>
      </div>
      ` : `<p class="saved-note">Score saved to My scores.</p>`}
      <div class="cta-row">
        <button class="cta" style="--subject-color:${color}" id="btn-again">Try again</button>
        <button class="cta secondary" id="btn-newtopic">Choose new topic</button>
      </div>
    </div>
  `;

  const saveBtn = document.getElementById('btn-save');
  if(saveBtn){
    saveBtn.addEventListener('click', async () => {
      const nameInput = document.getElementById('name-input');
      state.playerName = nameInput.value.trim();
      await saveResult();
      state.saved = true;
      render();
    });
  }
  document.getElementById('btn-again').addEventListener('click', () => {
    state.selectedTopics = new Set(state.selectedTopics);
    setScreen('setup');
  });
  document.getElementById('btn-newtopic').addEventListener('click', () => {
    state.selectedTopics = new Set();
    setScreen('setup');
  });
  document.getElementById('btn-history').addEventListener('click', () => setScreen('history'));
}

function saveResult(){
  try{
    const existing = localStorage.getItem('vocab-history');
    const list = existing ? JSON.parse(existing) : [];
    list.unshift({
      date: new Date().toISOString(),
      subject: state.subject,
      year: state.year,
      score: state.score,
      total: state.questions.length,
      name: state.playerName || null
    });
    localStorage.setItem('vocab-history', JSON.stringify(list.slice(0, 100)));
  }catch(err){
    // localStorage can fail in private browsing with very low quotas; safe to ignore here
  }
}

async function renderHistory(){
  app.innerHTML = `
    ${topBar()}
    <div class="hero">
      <h1>My scores</h1>
      <p>Every quiz you've saved on this device.</p>
    </div>
    <div class="card">
      <div id="history-list"><p class="empty-note">Loading...</p></div>
    </div>
    <div class="cta-row">
      <button class="cta secondary" id="btn-home">Back to subjects</button>
    </div>
  `;
  document.getElementById('btn-home').addEventListener('click', () => setScreen('home'));
  document.getElementById('btn-history').addEventListener('click', () => {});

  const listEl = document.getElementById('history-list');
  try{
    const existing = localStorage.getItem('vocab-history');
    const list = existing ? JSON.parse(existing) : [];
    if(list.length === 0){
      listEl.innerHTML = '<p class="empty-note">No saved scores yet. Finish a quiz and tap Save score.</p>';
      return;
    }
    listEl.innerHTML = list.map(item => {
      const meta = SUBJECT_META[item.subject] || {label:item.subject, color:'#999', letter:'?'};
      const d = new Date(item.date);
      const dateStr = d.toLocaleDateString(undefined, {day:'numeric', month:'short'});
      return `<div class="history-item">
        <div class="h-left">
          <div class="swatch" style="background:${meta.color}">${meta.letter}</div>
          <div>
            <div class="w" style="font-weight:700">${esc(meta.label)} · ${esc(item.year)}</div>
            <div class="meta">${item.name ? esc(item.name) + ' · ' : ''}${dateStr}</div>
          </div>
        </div>
        <div class="score">${item.score}/${item.total}</div>
      </div>`;
    }).join('');
  }catch(err){
    listEl.innerHTML = '<p class="empty-note">Could not load saved scores right now.</p>';
  }
}

function render(){
  if(state.screen === 'home') renderHome();
  else if(state.screen === 'setup') renderSetup();
  else if(state.screen === 'loading') renderLoading();
  else if(state.screen === 'quiz') renderQuiz();
  else if(state.screen === 'results') renderResults();
  else if(state.screen === 'history') renderHistory();
}

render();
</script>
